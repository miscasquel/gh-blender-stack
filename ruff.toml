# The lint scope this repository holds itself to: ruff's classic default rules
# (E4/E7/E9/F), the `--ignore` set from the extensions-compliance command, and
# the trees that are not ours to lint (the vendored wheel, spike evidence, build
# artifacts). Newer ruff versions grow their default selection — style rules for
# percent formatting and import aliases among them — and this tree's deliberate
# style is not that; pinning the set keeps `ruff check` meaningful and green.

extend-exclude = ["vendor", "spikes", "dist"]

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E741", "E731"]

# Exclusions do not apply to files ruff is handed explicitly (the compliance
# command passes each path through xargs), so the two trees that are not ours to
# lint are also silenced per-file: the vendored websockets wheel and the spike
# evidence scripts, which are kept as they ran.
[lint.per-file-ignores]
"blender/gh_stack/vendor/**" = ["ALL"]
"spikes/**" = ["ALL"]
