# The lint scope this repository holds itself to: ruff's classic default rules
# (E4/E7/E9/F), the `--ignore` set from the extensions-compliance command, and
# the build output that is not ours to lint. Newer ruff versions grow their
# default selection — style rules for percent formatting and import aliases
# among them — and this tree's deliberate style is not that; pinning the set
# keeps `ruff check` meaningful and green.

extend-exclude = ["dist"]

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E741", "E731"]
