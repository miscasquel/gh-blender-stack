# What actually runs here:
#   core     pure Python 3.13 and 3.14: ruff 0.17.2 + scripts/test-core
#   quality  Blender 5.3.0 on Ubuntu: scripts/check-all --ci, which runs docs,
#            ruff, core, the Blender headless + offline gate, the
#            installed-extension round trip, the deterministic baseline-gate
#            self-test and the two-build extension-zip reproducibility check.
#
# Benchmarks are deliberately not run here. The stored 2026-11-17 best-of-three
# p50/p95 baseline is reference-machine-specific; a stock runner has a
# different processor/platform, so the timing run would be meaningless and its
# hard budgets can fail on runner speed alone. `scripts/bench-baseline` is a
# local/release check; this workflow makes no performance claim.
#
# C# is local-only and intentionally not a job here.
#   scripts/test-gha needs wine with Mono's csc; its full suite also needs
#   Rhino 8's managed assemblies (RhinoCommon, Grasshopper, GH_IO). A stock
#   GitHub Ubuntu image has neither wine/wine-mono nor RhinoCommon/Grasshopper.
#   `scripts/test-gha --codec-only` was verified locally with a fresh
#   WINEPREFIX and no Rhino assemblies, but a stock-runner install was not
#   verified, so no job claims C# coverage. C# stays C# 5/Mono through 1.0
#   (ADR 0019); the full local gate covers it. The reproducible `.gha` check
#   (`scripts/test-reproducible-gha`) needs the same wine/Rhino assemblies and
#   is also local-only; this workflow claims neither.
#
# Native Windows/Rhino acceptance is deferred until after 0.8.0. This workflow
# does not claim native parity, Windows acceptance or .NET framework migration.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: core (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned ruff
        run: python -m pip install --quiet ruff==0.17.2
      - name: Lint
        run: ruff check --output-format=concise .
      - name: Core tests
        run: scripts/test-core

  quality:
    name: quality gate (Blender 5.3.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Blender runtime libraries
        # Blender runs headless here, but its binary still links the X11/GL and
        # OpenMP runtime. Install the small explicit set rather than relying on
        # whatever the runner image happens to carry.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-6 libxext6 libxi6 libxrandr2 libxinerama1 libxcursor1 \
            libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 \
            libxkbcommon0 libsm6 libice6 libgomp1
      - name: Cache Blender 5.3.0 Linux x64
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender-5.3.0-linux-x64
          key: ${{ runner.os }}-blender-5.3.0-linux-x64
      - name: Download and unpack Blender 5.3.0
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          archive="$RUNNER_TEMP/blender-5.3.0-linux-x64.tar.xz"
          curl -fL --retry 3 --retry-delay 5 -o "$archive" \
            https://download.blender.org/release/Blender5.3/blender-5.3.0-linux-x64.tar.xz
          mkdir -p "$RUNNER_TEMP/blender-5.3.0-linux-x64"
          tar -xJf "$archive" -C "$RUNNER_TEMP/blender-5.3.0-linux-x64" --strip-components=1
          rm -f "$archive"
      - name: Put Blender on PATH
        run: echo "$RUNNER_TEMP/blender-5.3.0-linux-x64" >> "$GITHUB_PATH"
      - name: Verify Blender
        run: blender --version
      - name: Install pinned ruff
        run: python -m pip install --quiet ruff==0.17.2
      - name: Run the quality gate (bench and C# skipped explicitly)
        run: scripts/check-all --ci
